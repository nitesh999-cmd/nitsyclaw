version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "19:00"
      timezone: Australia/Melbourne
    # Wait seven days before proposing a newly published version. A compromised
    # release is usually caught and yanked well inside that window.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      next-runtime:
        patterns:
          - next
          - react
          - react-dom
      test-tooling:
        patterns:
          - "@playwright/*"
          - vitest
          - "@vitest/*"
      lint-typecheck:
        patterns:
          - eslint
          - "@eslint/*"
          - "@typescript-eslint/*"
          - typescript
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "19:30"
      timezone: Australia/Melbourne
    # Same seven-day cooldown for action updates, which now arrive as SHA bumps.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
