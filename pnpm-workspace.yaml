packages:
  - "apps/*"
  - "packages/*"
# SINGLE OVERRIDE AUTHORITY. `package.json > pnpm.overrides` previously held a
# second, diverged copy of this list; it silently won, so edits here were inert
# and an `ip-address: 10.1.1` pin held a vulnerable version in place. That
# property is removed and this file is now the only source. Targets are exact
# fixed versions, not open-ended ranges, so a resolution can never drift upward
# without a visible edit here.
overrides:
  # Carried over unchanged from the former package.json list.
  drizzle-orm@<0.45.2: '0.45.2'
  esbuild@<0.28.1: '0.28.1'
  basic-ftp@<=5.3.1: '5.3.1'
  # 2026-09-10: widened and re-targeted. The prior '6.15.2' target is itself
  # GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (resolved via
  # apps__bot>googleapis>googleapis-common>qs); the old upper bound
  # (<=6.15.1) never covered it. '6.16.0' is the advisory-clearing release.
  qs@>=6.11.1 <6.16.0: '6.16.0'
  # Carried over, advanced to the advisory-clearing version.
  postcss@<8.5.23: '8.5.23'
  vite@<=6.4.2: '6.4.3'
  ws@>=8.0.0 <8.21.0: '8.21.0'
  brace-expansion@>=5.0.0 <5.0.9: '5.0.9'
  # New, clearing published advisories. Per-major so a consumer of one major is
  # never forced onto another.
  brace-expansion@<1.1.18: '1.1.18'
  brace-expansion@>=2.0.0 <2.1.4: '2.1.4'
  # 2026-09-10: prior target '4.3.1' is itself GHSA-2883-xcg3-v3hh (resolved
  # via .>eslint>@eslint/eslintrc>js-yaml). '4.3.2' clears it.
  js-yaml@>=4.0.0 <4.3.2: '4.3.2'
  nanoid@>=3.0.0 <3.3.18: '3.3.18'
  form-data@>=4.0.0 <4.0.6: '4.0.6'
  # Replaces the removed unconditional `ip-address: 10.1.1` pin, which held the
  # exact version carrying GHSA-mwp4-54f8-5fhr, -4xrf-jv44-h6hh and -22jq-vg5j-6vgg.
  ip-address@<10.3.1: '10.3.1'
  # CANDIDATES UNDER TEST (Option E). Both cross a boundary the parent declares,
  # so neither ships without the empirical proofs.
  # whatsapp-web.js@1.34.7 pins puppeteer to exactly 24.38.0; 25.5.0 is the first
  # release whose @puppeteer/browsers (3.1.0) drops extract-zip entirely.
  puppeteer@<25.5.0: '25.5.0'
  # 2026-09-10: prior target '0.35.3' is itself GHSA-rgj7-g3m4-5g8c (resolved
  # via apps__dashboard>next>sharp). next@16.3.4 now declares sharp ^0.35.4
  # itself (verified against its published package.json), so this override
  # would become redundant if next never regresses that range -- kept in
  # place anyway, target advanced to '0.35.4', so a future next downgrade
  # cannot silently reintroduce the vulnerable version without a visible edit
  # here.
  sharp@<0.35.4: '0.35.4'
  # 2026-09-10: GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g (resolved via
  # apps__dashboard>autoprefixer>browserslist), patched >=4.28.7. Target is
  # 4.28.8, not the newer 4.28.9 -- 4.28.9 was published inside this file's
  # own minimumReleaseAge (10080 min / 7 days) window at pin time and pnpm
  # would refuse it; 4.28.8 clears the advisory with margin and is old enough.
  browserslist@<4.28.7: '4.28.8'
  # GHSA-w5vr-8v7q-w6rv (patched >=2.11.0). browserslist@4.28.8's own
  # package.json declares baseline-browser-mapping ^2.11.12, which alone would
  # clear this -- but next@16.3.4 carries a SEPARATE, direct dependency on
  # baseline-browser-mapping@2.10.29 that has nothing to do with browserslist
  # (apps__dashboard>next>baseline-browser-mapping). Bumping browserslist left
  # that second path vulnerable; a post-install audit is what caught it, not
  # inspection of next's declared range. This override catches both paths.
  baseline-browser-mapping@<2.11.0: '2.11.20'
  # GHSA-w9m9-85wc-3x92 (resolved via apps__dashboard>tailwindcss>postcss-selector-parser),
  # patched >=6.1.3 on the 6.x line tailwindcss@^6.0.11 already accepts.
  postcss-selector-parser@<6.1.3: '6.1.4'
# Supply-chain controls (pnpm >= 10.26). Newly published versions are not installed
# immediately, transitive dependencies may not come from exotic sources, and a
# resolved version may never be silently downgraded.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Build-script allowlist (pnpm >= 10). pnpm blocks dependency build scripts by
# default, so puppeteer's postinstall — the step that downloads the exact Chrome
# build `executablePath()` resolves to — never runs, and `pnpm install` still
# exits 0. The laptop runtime then starts with no browser and fails at
# session-restore time instead of at install time. Allowing this one script is
# what makes the browser actually arrive with the install. Scope is deliberately
# puppeteer only.
onlyBuiltDependencies:
  - puppeteer
